<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kick Halay Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    #info {
      position: absolute;
      top: 8px;
      left: 12px;
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #info.show { opacity: 1; }
    #zilgit {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      font-weight: 900;
      color: #ff3b3b;
      text-shadow: 0 0 20px #ff0, 0 0 40px #f00;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.15s, transform 0.25s;
    }
    #zilgit.active {
      opacity: 1;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="info"></div>
  <div id="zilgit">🔥 ZILGIT! 🔥</div>

  <script src="/overlay.js"></script>
</body>
</html>
